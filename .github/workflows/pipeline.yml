name: Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 2.3.13). Leave empty to run CI only."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}

jobs:
  ci:
    if: inputs.version == ''
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        run: .\mvnw.cmd clean test -DexcludedGroups=playwright

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: |
            **/surefire-reports/*.xml
            **/failsafe-reports/*.xml
          if-no-files-found: ignore

  release:
    if: inputs.version != ''
    runs-on:
      - self-hosted
      - fundanalyzer
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: release/v${{ inputs.version }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # push (main/tags/develop) に GITHUB_TOKEN を使うため認証を保持する

      - name: Compute next development version
        id: versioning
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw "Invalid version format: $version"
          }
          $nextVersion = '{0}.{1}.{2}' -f $Matches[1], $Matches[2], ([int]$Matches[3] + 1)
          "next_version=$nextVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update develop branch
        run: |
          rem checkout -B / tag -f: 中断された過去の実行が残したローカルブランチ・タグがあっても再実行できるようにする
          git fetch --all --tags --prune
          git checkout -B develop origin/develop

      - name: Create release branch
        run: git checkout -B %RELEASE_BRANCH%

      - name: Set release version
        run: |
          rem バッチからの .cmd 呼び出しは call がないと制御が戻らず後続行が実行されない
          call mvnw.cmd versions:set -DnewVersion=%RELEASE_VERSION%
          call mvnw.cmd versions:commit

      - name: Commit release version
        run: 'git commit -am "release: v%RELEASE_VERSION%"'

      - name: Merge release branch into main
        run: |
          git checkout -B main origin/main
          git merge --no-ff %RELEASE_BRANCH%

      - name: Tag and push main
        run: |
          rem tag -f / push --force: 失敗したリリースの再実行で同一バージョンのタグを付け直せるようにする
          git tag -f v%RELEASE_VERSION%
          git push origin main
          git push --force origin refs/tags/v%RELEASE_VERSION%

      - name: Build release artifact
        run: mvnw.cmd clean package -DskipTests

      - name: Stop service
        run: |
          rem 1062 = ERROR_SERVICE_NOT_ACTIVE: already stopped is acceptable here
          sc stop fundanalyzer
          if %ERRORLEVEL% NEQ 0 if %ERRORLEVEL% NEQ 1062 exit /b %ERRORLEVEL%
          rem timeout.exe requires an interactive console and fails on CI runners
          powershell -NoProfile -Command "Start-Sleep -Seconds 5"

      - name: Back up current JAR
        run: copy /Y C:\fundanalyzer\bin\fundanalyzer.jar C:\fundanalyzer\bin\fundanalyzer.jar.bak

      - name: Deploy new JAR
        run: copy /Y target\fundanalyzer-%RELEASE_VERSION%.jar C:\fundanalyzer\bin\fundanalyzer.jar

      - name: Start service
        run: sc start fundanalyzer

      - name: Health check
        id: healthcheck
        continue-on-error: true
        shell: pwsh
        run: |
          # prod の Actuator は管理ポート 8990（application-prod.yml の management.server.port）
          $url = 'http://localhost:8990/actuator/health'
          $maxAttempts = 12
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -eq 200) {
                exit 0
              }
            } catch {
            }
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds 10
            }
          }
          exit 1

      - name: Roll back deployment
        if: steps.healthcheck.outcome == 'failure'
        run: |
          rem 1062 = ERROR_SERVICE_NOT_ACTIVE: already stopped is acceptable here
          sc stop fundanalyzer
          if %ERRORLEVEL% NEQ 0 if %ERRORLEVEL% NEQ 1062 exit /b %ERRORLEVEL%
          powershell -NoProfile -Command "Start-Sleep -Seconds 5"
          copy /Y C:\fundanalyzer\bin\fundanalyzer.jar.bak C:\fundanalyzer\bin\fundanalyzer.jar
          sc start fundanalyzer

      - name: Fail after rollback
        if: steps.healthcheck.outcome == 'failure'
        run: exit /b 1

      - name: Back-merge release into develop and bump version
        if: steps.healthcheck.outcome == 'success'
        # cmd の run ブロックは途中コマンドの失敗を握り潰し、最後の git push が
        # "Everything up-to-date"（exit 0）で終わるとステップが緑のまま develop 未更新になりうる。
        # pwsh で各コマンドの exit code を検査し、最後に origin/develop への反映も検証する。
        shell: pwsh
        env:
          NEXT_VERSION: ${{ steps.versioning.outputs.next_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked([string]$desc, [scriptblock]$cmd) {
            & $cmd
            if ($LASTEXITCODE -ne 0) { throw "$desc failed (exit $LASTEXITCODE)" }
          }
          Invoke-Checked 'checkout develop'            { git checkout develop }
          Invoke-Checked 'merge release into develop'  { git merge --no-ff $env:RELEASE_BRANCH }
          Invoke-Checked 'versions:set'                { & .\mvnw.cmd versions:set -DnewVersion="$($env:NEXT_VERSION)-SNAPSHOT" }
          Invoke-Checked 'versions:commit'             { & .\mvnw.cmd versions:commit }
          Invoke-Checked 'commit next dev version'     { git commit -am "chore: prepare next development version $($env:NEXT_VERSION)-SNAPSHOT" }
          Invoke-Checked 'push develop'                { git push origin develop }
          # push がサイレントに反映されない事象を検知するため、origin の実 SHA を直接照会して検証する
          $localRev  = (git rev-parse develop).Trim()
          $lsRemote  = (git ls-remote origin refs/heads/develop)
          if ($LASTEXITCODE -ne 0) { throw "ls-remote develop failed (exit $LASTEXITCODE)" }
          $remoteRev = (($lsRemote -split "\s+") | Select-Object -First 1).Trim()
          if ($localRev -ne $remoteRev) {
            throw "develop push not reflected on origin (local=$localRev remote=$remoteRev)"
          }
          Write-Output "develop advanced to $localRev ($($env:NEXT_VERSION)-SNAPSHOT)"

      - name: Delete local release branch
        if: steps.healthcheck.outcome == 'success'
        run: git branch -D %RELEASE_BRANCH%
