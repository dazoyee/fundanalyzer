server:
  port: 8890
  servlet:
    session:
      cookie:
        secure: true    # prod はリバースプロキシ（nginx 等）で TLS 終端した HTTPS 前提

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fundanalyzer?serverTimezone=Asia/Tokyo
    username: fundanalyzer
    password: fundanalyzer
    driverClassName: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 15000
      max-lifetime: 180000
      auto-commit: true

  flyway:
    enabled: true
    url: jdbc:mysql://localhost:3306/fundanalyzer?serverTimezone=Asia/Tokyo
    schemas: fundanalyzer
    user: fundanalyzer
    password: fundanalyzer
    baseline-on-migrate: true  # Flywayのマイグレーションスクリプトの実行バージョンを途中から始めるか否か
    baseline-version: 0.1.0  # baseline-on-migrate が true の場合に開始するバージョン
    baseline-description: Initial  # baseline-version で実施された場合に記録されるコメント
    locations: classpath:db/migration

  thymeleaf:
    encoding: UTF-8

  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=5m,recordStats

doma:
  dialect: mysql
  naming: snake_upper_case

logging:
  level:
    github.com.ioridazo.fundanalyzer: info

management:
  server:
    port: 8990
  metrics:
    tags:
      application: ${spring.application.name}-main
  # 本番では Actuator の公開を最小化し、環境変数（SECURITY_PASSWORD 等）の露出を防ぐ。
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: false

app:
  # 本番では Basic 認証の資格情報を環境変数で必須化（フォールバックなし → 未設定なら起動失敗で検知）。
  # release/config/application-prod.yml が未ロードの起動経路でも dev 既定値が漏れ込まないようにする。
  security:
    user: ${SECURITY_USER}
    password: ${SECURITY_PASSWORD}

  config:
    slack:
      parameter:
        t: ${SLACK_WEBHOOK_T:}
        b: ${SLACK_WEBHOOK_B:}
        x: ${SLACK_WEBHOOK_X:}
