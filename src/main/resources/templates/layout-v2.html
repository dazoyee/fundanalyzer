<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      class="h-full"
      x-data="{
        dark: localStorage.getItem('fundanalyzer.dark-mode') === 'true',
        sidebarOpen: false,
        toggleDark() {
          this.dark = !this.dark;
          localStorage.setItem('fundanalyzer.dark-mode', String(this.dark));
        }
      }"
      :class="{ 'dark': dark }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - fundanalyzer">fundanalyzer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="flex min-h-full bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100"
      th:attr="data-context-path=@{/}">

    <aside class="fixed inset-y-0 left-0 z-30 w-64 transform bg-white shadow-lg transition-transform duration-200 ease-in-out dark:bg-slate-800 dark:shadow-slate-900/50 md:translate-x-0"
           :class="{ '-translate-x-full': !sidebarOpen, 'translate-x-0': sidebarOpen }">
        <div class="flex h-16 items-center gap-2 border-b border-slate-200 px-4 dark:border-slate-700">
            <i data-lucide="building-2" class="text-blue-600 dark:text-blue-400"></i>
            <span class="text-lg font-bold">fundanalyzer</span>
        </div>
        <nav class="space-y-1 px-2 py-4">
            <a th:href="@{/v3/index}"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700">
                <i data-lucide="building-2"></i>
                会社一覧
            </a>
            <a th:href="@{/v3/valuation}"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700">
                <i data-lucide="trending-up"></i>
                株価評価
            </a>
            <a th:href="@{/v2/edinet-list}"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700">
                <i data-lucide="file-text"></i>
                EDINET 一覧
            </a>
        </nav>
    </aside>

    <div x-show="sidebarOpen"
         class="fixed inset-0 z-20 bg-black/50 md:hidden"
         @click="sidebarOpen = false"
         x-transition:enter="transition-opacity ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         style="display: none;"></div>

    <div class="flex flex-1 flex-col md:ml-64">
        <header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-slate-200 bg-white/80 px-4 backdrop-blur dark:border-slate-700 dark:bg-slate-800/80">
            <button type="button"
                    class="rounded-md p-2 hover:bg-slate-100 md:hidden dark:hover:bg-slate-700"
                    @click="sidebarOpen = !sidebarOpen"
                    aria-label="サイドバーを開閉">
                <i data-lucide="menu"></i>
            </button>
            <h1 class="hidden text-lg font-bold md:block" layout:fragment="page-title">fundanalyzer</h1>
            <button type="button"
                    class="rounded-md p-2 hover:bg-slate-100 dark:hover:bg-slate-700"
                    @click="toggleDark()"
                    aria-label="ダークモード切替">
                <i data-lucide="sun" class="hidden dark:inline-block"></i>
                <i data-lucide="moon" class="inline-block dark:hidden"></i>
            </button>
        </header>

        <main class="flex-1">
            <div class="mx-auto max-w-7xl px-4 py-6">
                <section layout:fragment="content">
                    <p>コンテンツがここに入ります</p>
                </section>
            </div>
        </main>

        <footer class="border-t border-slate-200 px-4 py-3 text-xs text-slate-500 dark:border-slate-700 dark:text-slate-400">
            <p>
                &copy; fundanalyzer
                <span layout:fragment="footer">画面刷新タスク Phase 2 layout-v2</span>
            </p>
        </footer>
    </div>

    <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
