<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      class="h-full"
      x-data="{
        dark: (() => {
          const stored = localStorage.getItem('fundanalyzer.dark-mode');
          if (stored !== null) return stored === 'true';
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        })(),
        sidebarOpen: false,
        sidebarCollapsed: localStorage.getItem('fundanalyzer.sidebar-collapsed') === 'true',
        toggleDark() {
          this.dark = !this.dark;
          localStorage.setItem('fundanalyzer.dark-mode', String(this.dark));
        },
        toggleSidebar() {
          if (window.matchMedia('(min-width: 768px)').matches) {
            this.sidebarCollapsed = !this.sidebarCollapsed;
            localStorage.setItem('fundanalyzer.sidebar-collapsed', String(this.sidebarCollapsed));
          } else {
            this.sidebarOpen = !this.sidebarOpen;
          }
        }
      }"
      :class="{ 'dark': dark }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF: htmx の非 GET リクエストでトークンヘッダを付与するために公開（dev は CSRF 無効のため空） -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title layout:title-pattern="$CONTENT_TITLE - fundanalyzer">fundanalyzer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="flex min-h-full bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100"
      th:attr="data-context-path=@{/}">

    <aside class="fixed inset-y-0 left-0 z-30 w-64 -translate-x-full transform bg-white shadow-lg transition-[width,transform] duration-200 ease-in-out dark:bg-slate-800 dark:shadow-slate-900/50 md:translate-x-0"
           :class="{ '-translate-x-full': !sidebarOpen, 'translate-x-0': sidebarOpen, 'md:w-16': sidebarCollapsed }">
        <div class="flex h-16 items-center gap-2 overflow-hidden border-b border-slate-200 px-4 dark:border-slate-700"
             :class="{ 'justify-center': sidebarCollapsed }">
            <i data-lucide="building-2" class="shrink-0 text-blue-600 dark:text-blue-400" aria-hidden="true"></i>
            <span class="text-lg font-bold" :class="{ 'hidden': sidebarCollapsed }">fundanalyzer</span>
        </div>
        <nav class="space-y-1 px-2 py-4">
            <a th:href="@{/v3/index}"
               title="会社一覧"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
               :class="{ 'justify-center': sidebarCollapsed }">
                <i data-lucide="building-2" class="shrink-0" aria-hidden="true"></i>
                <span :class="{ 'hidden': sidebarCollapsed }">会社一覧</span>
            </a>
            <a th:href="@{/v3/valuation}"
               title="株価評価"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
               :class="{ 'justify-center': sidebarCollapsed }">
                <i data-lucide="trending-up" class="shrink-0" aria-hidden="true"></i>
                <span :class="{ 'hidden': sidebarCollapsed }">株価評価</span>
            </a>
            <a th:href="@{/v3/edinet-list}"
               title="EDINET 一覧"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
               :class="{ 'justify-center': sidebarCollapsed }">
                <i data-lucide="file-text" class="shrink-0" aria-hidden="true"></i>
                <span :class="{ 'hidden': sidebarCollapsed }">EDINET 一覧</span>
            </a>
        </nav>
    </aside>

    <div x-show="sidebarOpen"
         class="fixed inset-0 z-20 bg-black/50 md:hidden"
         @click="sidebarOpen = false"
         x-transition:enter="transition-opacity ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         style="display: none;"></div>

    <div class="flex min-w-0 flex-1 flex-col overflow-x-hidden transition-[margin] duration-200"
         :class="sidebarCollapsed ? 'md:ml-16' : 'md:ml-64'">
        <header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-slate-200 bg-white/80 px-4 backdrop-blur dark:border-slate-700 dark:bg-slate-800/80">
            <button type="button"
                    class="rounded-md p-2 hover:bg-slate-100 dark:hover:bg-slate-700"
                    @click="toggleSidebar()"
                    aria-label="サイドバーを開閉">
                <i data-lucide="menu" aria-hidden="true"></i>
            </button>
            <h1 class="min-w-0 flex-1 truncate text-base font-bold sm:text-lg" layout:fragment="page-title">fundanalyzer</h1>
            <button type="button"
                    class="rounded-md p-2 hover:bg-slate-100 dark:hover:bg-slate-700"
                    @click="toggleDark()"
                    aria-label="ダークモード切替">
                <i data-lucide="sun" class="hidden dark:inline-block" aria-hidden="true"></i>
                <i data-lucide="moon" class="inline-block dark:hidden" aria-hidden="true"></i>
            </button>
        </header>

        <main class="flex-1 pb-20 sm:pb-0">
            <div class="mx-auto max-w-7xl px-4 py-6">
                <section layout:fragment="content">
                    <p>コンテンツがここに入ります</p>
                </section>
            </div>
        </main>

        <footer class="border-t border-slate-200 px-4 py-3 text-xs text-slate-500 dark:border-slate-700 dark:text-slate-400">
            <p>
                &copy; fundanalyzer
                <span th:text="'v' + ${applicationVersion}">v?.?.?</span>
            </p>
        </footer>
    </div>

    <nav aria-label="モバイルナビ"
         x-data="{ pathname: window.location.pathname }"
         class="fixed inset-x-0 bottom-0 z-20 flex h-16 border-t border-slate-200 bg-white shadow-lg dark:border-slate-700 dark:bg-slate-800 sm:hidden">
        <th:block layout:fragment="mobile-bottom-nav">
            <a th:href="@{/v3/index}"
               :class="pathname.endsWith('/v3/index') ? 'text-blue-600 dark:text-blue-400' : 'text-slate-600 dark:text-slate-300'"
               x-bind:aria-current="pathname.endsWith('/v3/index') ? 'page' : null"
               class="flex min-h-[44px] flex-1 flex-col items-center justify-center gap-1 px-2 text-xs text-slate-600 dark:text-slate-300">
                <i data-lucide="building-2" class="h-5 w-5" aria-hidden="true"></i>
                <span>会社</span>
            </a>
            <a th:href="@{/v3/valuation}"
               :class="pathname.endsWith('/v3/valuation') ? 'text-blue-600 dark:text-blue-400' : 'text-slate-600 dark:text-slate-300'"
               x-bind:aria-current="pathname.endsWith('/v3/valuation') ? 'page' : null"
               class="flex min-h-[44px] flex-1 flex-col items-center justify-center gap-1 px-2 text-xs text-slate-600 dark:text-slate-300">
                <i data-lucide="trending-up" class="h-5 w-5" aria-hidden="true"></i>
                <span>株価</span>
            </a>
            <a th:href="@{/v3/edinet-list}"
               :class="(pathname.endsWith('/v3/edinet-list') || pathname.endsWith('/v3/edinet-list-detail')) ? 'text-blue-600 dark:text-blue-400' : 'text-slate-600 dark:text-slate-300'"
               x-bind:aria-current="(pathname.endsWith('/v3/edinet-list') || pathname.endsWith('/v3/edinet-list-detail')) ? 'page' : null"
               class="flex min-h-[44px] flex-1 flex-col items-center justify-center gap-1 px-2 text-xs text-slate-600 dark:text-slate-300">
                <i data-lucide="file-text" class="h-5 w-5" aria-hidden="true"></i>
                <span>EDINET</span>
            </a>
        </th:block>
    </nav>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
