<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout-v2}">
<head>
    <title>分析</title>
</head>
<body>
<h1 layout:fragment="page-title" class="flex min-w-0 flex-1 items-center gap-2">
    <span class="min-w-0 flex-1 truncate text-base font-bold sm:text-lg">分析ダッシュボード</span>
</h1>

<section layout:fragment="content" class="space-y-4"
         x-data="{ tab: 'trend' }">
    <section th:if="${staleStockCompanyCount > 0}"
             class="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900 dark:border-amber-500/40 dark:bg-amber-500/10 dark:text-amber-100">
        <p class="font-semibold" th:text="|株価が${stockCompanyStalenessAlertDays}日以上更新されていない銘柄が ${staleStockCompanyCount} 件あります。|">
            株価が14日以上更新されていない銘柄があります。
        </p>
        <p class="mt-1 text-xs text-amber-800 dark:text-amber-200">
            <span th:each="item, stat : ${staleStockCompanies}">
                <span th:text="|${item.code} (${item.staleDays}日)|">1111 (20日)</span><span th:if="${!stat.last}">, </span>
            </span>
        </p>
    </section>

    <nav class="flex flex-wrap gap-1 border-b border-slate-200 dark:border-slate-700" role="tablist" aria-label="分析タブ">
        <button type="button"
                role="tab"
                @click="tab = 'trend'"
                :aria-selected="String(tab === 'trend')"
                :class="tab === 'trend' ? 'border-blue-600 text-blue-600 dark:border-blue-400 dark:text-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
                class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="trending-up" class="h-4 w-4" aria-hidden="true"></i>
            個別推移
        </button>
        <button type="button"
                role="tab"
                @click="tab = 'backtest'"
                th:attr="hx-get=@{/v3/analysis/backtest}"
                hx-target="#backtest-panel"
                hx-swap="innerHTML"
                hx-trigger="click once"
                :aria-selected="String(tab === 'backtest')"
                :class="tab === 'backtest' ? 'border-blue-600 text-blue-600 dark:border-blue-400 dark:text-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
                class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="history" class="h-4 w-4" aria-hidden="true"></i>
            バックテスト
        </button>
        <button type="button"
                role="tab"
                @click="tab = 'distribution'"
                th:attr="hx-get=@{/v3/analysis/distribution}"
                hx-target="#distribution-panel"
                hx-swap="innerHTML"
                hx-trigger="click once"
                :aria-selected="String(tab === 'distribution')"
                :class="tab === 'distribution' ? 'border-blue-600 text-blue-600 dark:border-blue-400 dark:text-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
                class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="bar-chart-3" class="h-4 w-4" aria-hidden="true"></i>
            分布
        </button>
    </nav>

    <div x-show="tab === 'trend'" class="grid gap-4 xl:grid-cols-[26rem_minmax(0,1fr)]">
        <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <div class="border-b border-slate-200 px-4 py-3 dark:border-slate-700">
                <h2 class="text-sm font-bold">割安度ランキング</h2>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">行を選択すると評価推移を読み込みます。</p>
            </div>
            <div class="hidden overflow-x-auto sm:block">
                <table class="min-w-full text-left text-sm">
                    <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500 dark:bg-slate-900/60 dark:text-slate-400">
                    <tr>
                        <th class="whitespace-nowrap px-4 py-3 font-medium">コード</th>
                        <th class="whitespace-nowrap px-4 py-3 font-medium">会社名</th>
                        <th class="whitespace-nowrap px-4 py-3 font-medium">割安度%</th>
                        <th class="whitespace-nowrap px-4 py-3 font-medium">グレアム</th>
                        <th class="whitespace-nowrap px-4 py-3 font-medium">対象日</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                    <tr th:each="item : ${ranking}"
                        class="cursor-pointer transition hover:bg-slate-50 dark:hover:bg-slate-700/50"
                        th:attr="hx-get=@{/v3/analysis/{c}/chart(c=${item.code})}"
                        hx-target="#analysis-chart"
                        hx-trigger="click">
                        <td class="whitespace-nowrap px-4 py-3 font-mono text-xs text-slate-600 dark:text-slate-300" th:text="${item.code}">0000</td>
                        <td class="whitespace-nowrap px-4 py-3 font-medium text-slate-900 dark:text-slate-100" th:text="${item.name}">会社名</td>
                        <td class="whitespace-nowrap px-4 py-3 text-emerald-600 dark:text-emerald-400" th:text="${item.discountRate != null ? #numbers.formatDecimal(item.discountRate * 100, 1, 0) + '%' : '-'}">0%</td>
                        <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300" th:text="${item.grahamIndex}">0</td>
                        <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300">
                            <span th:text="${item.targetDate}">2026-01-01</span>
                            <span th:if="${item.stale}"
                                  class="ml-2 inline-flex items-center rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-medium text-amber-800 dark:bg-amber-500/15 dark:text-amber-200">古い</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <ul class="block space-y-3 p-4 sm:hidden" aria-label="割安度ランキング">
                <li th:each="item : ${ranking}"
                    data-mobile-card
                    class="cursor-pointer rounded-lg border border-slate-200 bg-white p-4 shadow-sm transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700/50"
                    th:attr="hx-get=@{/v3/analysis/{c}/chart(c=${item.code})}"
                    hx-target="#analysis-chart"
                    hx-trigger="click">
                    <div class="flex items-start justify-between gap-3">
                        <div class="min-w-0">
                            <p class="font-mono text-xs text-slate-600 dark:text-slate-300" th:text="${item.code}">0000</p>
                            <p class="truncate font-semibold text-slate-900 dark:text-slate-100" th:text="${item.name}">会社名</p>
                        </div>
                        <i data-lucide="chevron-right" class="mt-0.5 h-4 w-4 shrink-0 text-slate-400" aria-hidden="true"></i>
                    </div>
                    <dl class="mt-3 grid grid-cols-2 gap-x-3 gap-y-1 text-xs">
                        <div>
                            <dt class="text-slate-500 dark:text-slate-400">割安度%</dt>
                            <dd class="text-emerald-600 dark:text-emerald-400" th:text="${item.discountRate != null ? #numbers.formatDecimal(item.discountRate * 100, 1, 0) + '%' : '-'}">0%</dd>
                        </div>
                        <div>
                            <dt class="text-slate-500 dark:text-slate-400">グレアム</dt>
                            <dd class="text-slate-600 dark:text-slate-300" th:text="${item.grahamIndex}">0</dd>
                        </div>
                        <div class="col-span-2">
                            <dt class="text-slate-500 dark:text-slate-400">対象日</dt>
                            <dd class="text-slate-600 dark:text-slate-300">
                                <span th:text="${item.targetDate}">2026-01-01</span>
                                <span th:if="${item.stale}"
                                      class="ml-2 inline-flex items-center rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-medium text-amber-800 dark:bg-amber-500/15 dark:text-amber-200">古い</span>
                            </dd>
                        </div>
                    </dl>
                </li>
            </ul>
        </section>

        <section id="analysis-chart"
                 class="flex min-h-[28rem] items-center justify-center rounded-xl border border-dashed border-slate-300 bg-white/70 p-6 text-center text-sm text-slate-500 shadow-sm dark:border-slate-700 dark:bg-slate-800/70 dark:text-slate-400">
            ランキングから銘柄を選択すると、企業価値と評価推移を表示します。
        </section>
    </div>

    <section x-show="tab === 'backtest'">
        <div id="backtest-panel"
             class="rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-700 dark:bg-slate-800">
            読み込み中…
        </div>
    </section>

    <section x-show="tab === 'distribution'">
        <div id="distribution-panel"
             class="rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-700 dark:bg-slate-800">
            読み込み中…
        </div>
    </section>
</section>
</body>
</html>
