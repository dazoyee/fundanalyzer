<!DOCTYPE html>
<html lang="ja" class="h-full" xmlns:th="http://www.thymeleaf.org" x-data="{ dark: false }" :class="{ 'dark': dark }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 1 POC – fundanalyzer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-full bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <header class="border-b border-slate-200 dark:border-slate-700">
        <div class="mx-auto flex max-w-6xl items-center justify-between p-4">
            <h1 class="flex items-center gap-2 text-xl font-bold">
                <i data-lucide="building-2"></i>
                Phase 1 POC
            </h1>
            <button class="rounded border border-slate-300 px-3 py-1 hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-800"
                    type="button"
                    @click="dark = !dark">
                <span x-show="!dark">🌙 Dark</span>
                <span x-show="dark">☀️ Light</span>
            </button>
        </div>
    </header>

    <main class="mx-auto max-w-6xl space-y-6 p-4">
        <section class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800">
            <h2 class="mb-2 text-lg font-bold">1. Tailwind utility + レスポンシブ</h2>
            <p>このカードが配色・ボーダー・パディングで表示されていれば OK。下のグリッドはビューポート幅で列数が変わる。</p>
            <div class="mt-4 grid grid-cols-1 gap-2 xs:grid-cols-2 sm:grid-cols-3 md:grid-cols-4">
                <div class="rounded bg-blue-500 p-2 text-center text-white">375px+</div>
                <div class="rounded bg-emerald-500 p-2 text-center text-white">640px+</div>
                <div class="rounded bg-amber-500 p-2 text-center text-white">768px+</div>
                <div class="rounded bg-rose-500 p-2 text-center text-white">1024px+</div>
            </div>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800">
            <h2 class="mb-2 text-lg font-bold">2. htmx 部分更新</h2>
            <button class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
                    type="button"
                    hx-get="/fundanalyzer/v2/__phase1-poc/fragment"
                    hx-target="#htmx-result">
                クリックしてフラグメント取得
            </button>
            <div id="htmx-result" class="mt-3"></div>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800"
                 x-data="{ count: 0 }">
            <h2 class="mb-2 text-lg font-bold">3. Alpine.js カウンタ</h2>
            <div class="flex items-center gap-3">
                <button class="rounded bg-slate-200 px-3 py-1 dark:bg-slate-700" type="button" @click="count--">-</button>
                <span class="text-2xl font-bold" x-text="count"></span>
                <button class="rounded bg-slate-200 px-3 py-1 dark:bg-slate-700" type="button" @click="count++">+</button>
            </div>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800">
            <h2 class="mb-2 text-lg font-bold">4. Lucide アイコン</h2>
            <div class="flex flex-wrap gap-4 text-slate-600 dark:text-slate-300">
                <i data-lucide="circle"></i>
                <i data-lucide="check-circle"></i>
                <i data-lucide="alert-triangle"></i>
                <i data-lucide="trending-up"></i>
                <i data-lucide="building-2"></i>
                <i data-lucide="search"></i>
            </div>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800">
            <h2 class="mb-2 text-lg font-bold">5. Litepicker 期間選択</h2>
            <input id="litepicker-input" type="text"
                   class="w-full rounded border border-slate-300 px-3 py-2 sm:w-auto dark:border-slate-600 dark:bg-slate-900"
                   placeholder="期間を選択">
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    new window.Litepicker({
                        element: document.getElementById('litepicker-input'),
                        singleMode: false
                    });
                });
            </script>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800">
            <h2 class="mb-2 text-lg font-bold">6. Chart.js グラフ</h2>
            <div class="relative h-64">
                <canvas id="phase1-chart"></canvas>
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    new window.Chart(document.getElementById('phase1-chart').getContext('2d'), {
                        type: 'line',
                        data: {
                            labels: ['1月','2月','3月','4月','5月'],
                            datasets: [{
                                label: 'POC グラフ',
                                data: [12, 19, 7, 15, 22],
                                borderColor: 'rgb(59 130 246)',
                                backgroundColor: 'rgba(59, 130, 246, 0.2)'
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                });
            </script>
        </section>
    </main>

    <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
