<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout-v2}">
<head>
    <title>EDINET 詳細</title>
</head>
<body>
<h1 layout:fragment="page-title">
    <span class="inline-flex items-center gap-2">
        <a th:href="@{/v3/edinet-list}"
           class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-400">
            <i data-lucide="arrow-left" class="inline-block h-4 w-4"></i> 一覧へ
        </a>
        <span class="text-slate-400">/</span>
        <span>EDINET 詳細 <span class="font-mono text-base" th:text="${submitDate}">2025-01-01</span></span>
    </span>
</h1>

<section layout:fragment="content" class="space-y-6" th:with="ed=${edinetDetail.edinetList}">
    <div class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800">
        <h2 class="mb-3 text-lg font-bold">処理状況サマリ</h2>
        <dl class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm sm:grid-cols-4">
            <div>
                <dt class="text-slate-500 dark:text-slate-400">提出日</dt>
                <dd class="font-mono" th:text="${ed.submitDate}">-</dd>
            </div>
            <div>
                <dt class="text-slate-500 dark:text-slate-400">総件数</dt>
                <dd class="font-mono" th:text="${ed.countAll}">0</dd>
            </div>
            <div>
                <dt class="text-slate-500 dark:text-slate-400">対象件数</dt>
                <dd class="font-mono" th:text="${ed.countTarget}">0</dd>
            </div>
            <div>
                <dt class="text-slate-500 dark:text-slate-400">処理済</dt>
                <dd class="font-mono" th:text="${ed.countScraped}">0</dd>
            </div>
            <div>
                <dt class="text-slate-500 dark:text-slate-400">分析済</dt>
                <dd class="font-mono" th:text="${ed.countAnalyzed}">0</dd>
            </div>
            <div>
                <dt class="text-slate-500 dark:text-slate-400">未処理</dt>
                <dd class="font-mono" th:text="${ed.countNotScraped}">0</dd>
            </div>
            <div>
                <dt class="text-slate-500 dark:text-slate-400">対象外</dt>
                <dd class="font-mono" th:text="${ed.countNotTarget}">0</dd>
            </div>
        </dl>
    </div>

    <div class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800">
        <h2 class="mb-3 text-lg font-bold">未処理ドキュメント</h2>
        <div class="overflow-x-auto" th:if="${edinetDetail.documentDetailList != null and !edinetDetail.documentDetailList.isEmpty()}">
            <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                <thead class="bg-slate-50 dark:bg-slate-700">
                <tr>
                    <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300">ドキュメント</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                <tr th:each="doc : ${edinetDetail.documentDetailList}">
                    <td class="px-3 py-2 text-sm" th:text="${doc}">document detail</td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="text-sm text-slate-500 dark:text-slate-400"
           th:if="${edinetDetail.documentDetailList == null or edinetDetail.documentDetailList.isEmpty()}">
            未処理ドキュメントはありません
        </p>
    </div>
</section>
</body>
</html>
