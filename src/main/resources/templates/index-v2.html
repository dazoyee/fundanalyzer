<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout-v2}">
<head>
    <title>会社一覧</title>
</head>
<body>
<h1 layout:fragment="page-title" class="flex min-w-0 flex-1 items-center gap-2"
    x-data="{ actionOpen: false }"
    @keydown.escape.window="actionOpen = false">
    <span class="min-w-0 flex-1 truncate text-base font-bold sm:text-lg">会社一覧</span>

    <!-- 取得・分析メニュー起動ボタン（全解像度で表示） -->
    <button type="button"
            @click="actionOpen = true"
            class="shrink-0 rounded-md p-2 hover:bg-slate-100 dark:hover:bg-slate-700"
            :aria-expanded="String(actionOpen)"
            aria-label="取得・分析メニューを開く">
        <i data-lucide="settings-2" class="h-5 w-5" aria-hidden="true"></i>
    </button>

    <!--
      オーバーレイは body 直下へ teleport する。
      ヘッダー（layout-v2.html）が backdrop-blur を持ち position:fixed の containing block を
      生成するため、ヘッダー内に置くと fixed がビューポート基準にならない。
    -->
    <template x-teleport="body">
        <div>
            <!-- バックドロップ -->
            <div x-show="actionOpen"
                 @click="actionOpen = false"
                 x-transition:enter="transition-opacity ease-out duration-200"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition-opacity ease-in duration-150"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 style="display: none;"
                 class="fixed inset-0 z-50 bg-black/50"></div>

            <!-- パネル: スマホ=ボトムシート / PC=中央モーダル -->
            <div x-show="actionOpen"
                 x-init="$watch('actionOpen', function (val) { if (val) $nextTick(function () { $refs.firstField && $refs.firstField.focus(); }); })"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="translate-y-full opacity-0 sm:translate-y-4 sm:scale-95"
                 x-transition:enter-end="translate-y-0 opacity-100 sm:scale-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="translate-y-0 opacity-100 sm:scale-100"
                 x-transition:leave-end="translate-y-full opacity-0 sm:translate-y-4 sm:scale-95"
                 style="display: none;"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="action-menu-title"
                 class="fixed inset-x-0 bottom-0 z-50 max-h-[85vh] overflow-y-auto rounded-t-2xl bg-white p-4 text-slate-900 shadow-xl dark:bg-slate-800 dark:text-slate-100 sm:inset-x-auto sm:bottom-auto sm:left-1/2 sm:top-1/2 sm:w-full sm:max-w-lg sm:-translate-x-1/2 sm:-translate-y-1/2 sm:rounded-2xl">
                <div class="mb-3 flex items-center justify-between">
                    <h2 id="action-menu-title" class="text-base font-bold">取得・分析メニュー</h2>
                    <button type="button"
                            @click="actionOpen = false"
                            class="rounded-md p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700"
                            aria-label="閉じる">
                        <!-- teleport 後は初期 createIcons の対象外になるためインライン SVG（lucide:x 相当） -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M18 6 6 18"/>
                            <path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>
                <!-- フォームはモーダル（dark:bg-slate-800）より一段暗い dark:bg-slate-900 でコントラストを付ける -->
                <div class="grid grid-cols-1 gap-3 text-left md:grid-cols-2">
                    <form method="post" th:action="@{/v1/document/analysis}"
                          class="rounded-lg border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-900">
                        <label for="analysisFromToDate" class="mb-2 block text-sm font-bold">財務諸表の取得と分析をする</label>
                        <div class="flex flex-wrap items-center gap-2">
                            <input type="text" id="analysisFromToDate" name="fromToDate" placeholder="2024-01-01,2024-12-31"
                                   x-ref="firstField"
                                   class="flex-1 min-w-0 rounded border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900"/>
                            <button type="submit"
                                    class="rounded bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
                                実行
                            </button>
                        </div>
                        <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">日付範囲（カンマ区切り）を入力</p>
                    </form>
                    <form method="post" th:action="@{/v1/scrape/id}"
                          class="rounded-lg border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-900">
                        <label for="documentId" class="mb-2 block text-sm font-bold">書類IDから取得と分析する</label>
                        <div class="flex flex-wrap items-center gap-2">
                            <input type="text" id="documentId" name="documentId" placeholder="S100XXXX"
                                   class="flex-1 min-w-0 rounded border border-slate-300 px-3 py-2 text-sm font-mono dark:border-slate-600 dark:bg-slate-900"/>
                            <button type="submit"
                                    class="rounded bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
                                実行
                            </button>
                        </div>
                        <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">書類 ID を入力</p>
                    </form>
                    <form method="post" th:action="@{/v2/import/stock/date}"
                          class="rounded-lg border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-900">
                        <label for="stockFromToDate" class="mb-2 block text-sm font-bold">企業の株価を取得する（書類提出日を指定）</label>
                        <div class="flex flex-wrap items-center gap-2">
                            <input type="text" id="stockFromToDate" name="fromToDate" placeholder="2024-01-01,2024-12-31"
                                   class="flex-1 min-w-0 rounded border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900"/>
                            <button type="submit"
                                    class="rounded bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
                                実行
                            </button>
                        </div>
                    </form>
                    <form method="post" th:action="@{/v2/evaluate}"
                          class="rounded-lg border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-900">
                        <h3 class="mb-2 text-sm font-bold">株価を評価する</h3>
                        <div class="flex flex-wrap items-center gap-2">
                            <p class="flex-1 text-sm text-slate-500 dark:text-slate-400">全企業の評価を再計算します</p>
                            <button type="submit"
                                    class="rounded bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
                                実行
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </template>
</h1>

<section layout:fragment="content" class="space-y-4">
    <!-- Flash アラート -->
    <th:block th:if="${message != null}">
        <div th:replace="~{fragments/alert :: warning(message=${message})}"></div>
    </th:block>

    <!-- システムイベント: 既定はサマリのみ。明細は企業・書類単位に集約して折りたたむ -->
    <section x-data="{ open: false }"
             class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                <h2 class="text-sm font-bold text-slate-900 dark:text-slate-100">システムイベント</h2>
                <span th:text="'直近' + ${systemEventDays} + '日'"
                      class="rounded bg-slate-100 px-1.5 py-0.5 text-[11px] font-medium text-slate-500 dark:bg-slate-700 dark:text-slate-400"></span>
                <span th:if="${systemEventSummary.errorCount() > 0}"
                      class="inline-flex items-center gap-1 rounded-full bg-rose-100 px-2 py-0.5 text-xs font-bold text-rose-700 dark:bg-rose-500/15 dark:text-rose-300">
                    <i data-lucide="octagon-alert" class="h-3.5 w-3.5" aria-hidden="true"></i>
                    <span th:text="'ERROR ' + ${systemEventSummary.errorCount()}"></span>
                </span>
                <span th:if="${systemEventSummary.warningCount() > 0}"
                      class="inline-flex items-center gap-1 rounded-full bg-amber-100 px-2 py-0.5 text-xs font-bold text-amber-700 dark:bg-amber-500/15 dark:text-amber-300">
                    <i data-lucide="triangle-alert" class="h-3.5 w-3.5" aria-hidden="true"></i>
                    <span th:text="'WARNING ' + ${systemEventSummary.warningCount()}"></span>
                </span>
                <span th:if="${systemEventSummary.totalCount() == 0}"
                      class="inline-flex items-center gap-1 rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-bold text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300">
                    <i data-lucide="check" class="h-3.5 w-3.5" aria-hidden="true"></i>
                    異常なし
                </span>
                <span th:if="${systemEventSummary.latestOccurredAt() != null}"
                      th:text="'最終発生 ' + ${systemEventSummary.latestOccurredAt()}"
                      class="text-xs text-slate-500 dark:text-slate-400"></span>
            </div>
            <button th:if="${systemEventSummary.totalCount() > 0}"
                    type="button"
                    @click="open = !open"
                    :aria-expanded="open"
                    class="inline-flex items-center gap-1 rounded border border-slate-300 px-2.5 py-1 text-xs font-medium text-slate-600 hover:bg-slate-50 dark:border-slate-600 dark:text-slate-300 dark:hover:bg-slate-700">
                <i data-lucide="chevron-down" :class="open ? 'rotate-180' : ''" class="h-3.5 w-3.5 shrink-0 transition-transform duration-200" aria-hidden="true"></i>
                <span x-text="open ? '閉じる' : '明細'"></span>
            </button>
        </div>

        <div th:if="${systemEventSummary.totalCount() > 0}" x-show="open" x-cloak class="mt-3 overflow-x-auto">
            <table class="w-full min-w-[40rem] text-left text-sm">
                <thead class="border-b border-slate-200 text-xs text-slate-500 dark:border-slate-700 dark:text-slate-400">
                <tr>
                    <th scope="col" class="px-2 py-1.5 font-medium">種別</th>
                    <th scope="col" class="px-2 py-1.5 font-medium">企業／発生源</th>
                    <th scope="col" class="px-2 py-1.5 font-medium">書類ID</th>
                    <th scope="col" class="px-2 py-1.5 text-right font-medium">件数</th>
                    <th scope="col" class="px-2 py-1.5 font-medium">最終発生</th>
                </tr>
                </thead>
                <tbody th:each="group : ${systemEventSummary.groups()}" x-data="{ detail: false }"
                       class="border-b border-slate-100 align-top dark:border-slate-700/60">
                <tr @click="detail = !detail"
                    class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/40">
                    <td class="px-2 py-1.5">
                        <span th:text="${group.eventTypeLabel()}"
                              th:classappend="${group.badgeClass()}"
                              class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-bold tracking-wide"></span>
                    </td>
                    <td class="px-2 py-1.5 font-medium text-slate-800 dark:text-slate-100">
                        <span class="inline-flex items-center gap-1">
                            <i data-lucide="chevron-right" :class="detail ? 'rotate-90' : ''" class="h-3.5 w-3.5 shrink-0 transition-transform duration-200" aria-hidden="true"></i>
                            <span th:text="${group.label()}"></span>
                        </span>
                    </td>
                    <td th:text="${group.documentId()} ?: '-'"
                        class="px-2 py-1.5 font-mono text-xs text-slate-500 dark:text-slate-400"></td>
                    <td th:text="${group.count()}" class="px-2 py-1.5 text-right tabular-nums text-slate-600 dark:text-slate-300"></td>
                    <td th:text="${group.latestOccurredAt()}" class="px-2 py-1.5 text-xs text-slate-500 dark:text-slate-400"></td>
                </tr>
                <tr x-show="detail" x-cloak>
                    <td colspan="5" class="px-2 pb-2">
                        <ul class="space-y-1 rounded-lg bg-slate-50 p-2 dark:bg-slate-900/60">
                            <li th:each="event : ${group.events()}"
                                class="flex flex-col gap-0.5 text-xs sm:flex-row sm:items-baseline sm:justify-between sm:gap-3">
                                <span th:text="${event.detail()}" class="text-slate-700 dark:text-slate-200"></span>
                                <span th:text="${event.occurredAt()}" class="shrink-0 text-slate-400 dark:text-slate-500"></span>
                            </li>
                        </ul>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div x-data="{ open: false }"
         @keydown.escape.window="open = false"
         class="flex items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-700">
        <nav class="flex flex-wrap gap-1" role="tablist" aria-label="表示切替">
            <a th:href="@{/v3/index(q=${keyword},sort=${sortParam})}"
               role="tab"
               th:attr="aria-selected=${#strings.isEmpty(target)}"
               th:classappend="${#strings.isEmpty(target)} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
               class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
                <i data-lucide="layout-grid" class="h-4 w-4" aria-hidden="true"></i>
                メイン
            </a>
            <a th:href="@{/v3/index(target='quart',q=${keyword},sort=${sortParam})}"
               role="tab"
               th:attr="aria-selected=${target == 'quart'}"
               th:classappend="${target == 'quart'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
               class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
                <i data-lucide="calendar-days" class="h-4 w-4" aria-hidden="true"></i>
                中間
            </a>
            <a th:href="@{/v3/index(target='all',q=${keyword},sort=${sortParam})}"
               role="tab"
               th:attr="aria-selected=${target == 'all'}"
               th:classappend="${target == 'all'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
               class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
                <i data-lucide="layers" class="h-4 w-4" aria-hidden="true"></i>
                すべて
            </a>
            <a th:href="@{/v3/index(target='favorite',q=${keyword},sort=${sortParam})}"
               role="tab"
               th:attr="aria-selected=${target == 'favorite'}"
               th:classappend="${target == 'favorite'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
               class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
                <i data-lucide="heart" class="h-4 w-4" aria-hidden="true"></i>
                お気に入り
            </a>
            <a th:href="@{/v3/index(target='star',q=${keyword},sort=${sortParam})}"
               role="tab"
               th:attr="aria-selected=${target == 'star'}"
               th:classappend="${target == 'star'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
               class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
                <i data-lucide="star" class="h-4 w-4" aria-hidden="true"></i>
                注目
            </a>
        </nav>
        <button type="button"
                @click="open = true"
                hx-get="/v3/index/filter-setting"
                hx-trigger="click"
                hx-target="#index-filter-setting-modal-body"
                hx-swap="innerHTML"
                class="mb-2 inline-flex items-center gap-1 rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:border-slate-600 dark:text-slate-300 dark:hover:bg-slate-800"
                aria-label="メイン表示フィルタ設定を開く">
            <i data-lucide="settings" class="h-4 w-4" aria-hidden="true"></i>
            設定
        </button>

        <template x-teleport="body">
            <div>
                <div x-show="open"
                     @click="open = false"
                     x-transition:enter="transition-opacity ease-out duration-200"
                     x-transition:enter-start="opacity-0"
                     x-transition:enter-end="opacity-100"
                     x-transition:leave="transition-opacity ease-in duration-150"
                     x-transition:leave-start="opacity-100"
                     x-transition:leave-end="opacity-0"
                     style="display: none;"
                     class="fixed inset-0 z-50 bg-black/50"></div>
                <div x-show="open"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="translate-y-full opacity-0 sm:translate-y-4 sm:scale-95"
                     x-transition:enter-end="translate-y-0 opacity-100 sm:scale-100"
                     x-transition:leave="transition ease-in duration-150"
                     x-transition:leave-start="translate-y-0 opacity-100 sm:scale-100"
                     x-transition:leave-end="translate-y-full opacity-0 sm:translate-y-4 sm:scale-95"
                     style="display: none;"
                     role="dialog"
                     aria-modal="true"
                     aria-labelledby="filter-setting-title"
                     class="fixed inset-x-0 bottom-0 z-50 max-h-[85vh] overflow-y-auto rounded-t-2xl bg-white p-4 text-slate-900 shadow-xl dark:bg-slate-800 dark:text-slate-100 sm:inset-x-auto sm:bottom-auto sm:left-1/2 sm:top-1/2 sm:w-full sm:max-w-2xl sm:-translate-x-1/2 sm:-translate-y-1/2 sm:rounded-2xl">
                    <div class="mb-3 flex items-center justify-between">
                        <h2 id="filter-setting-title" class="text-base font-bold">メイン表示フィルタ設定</h2>
                        <button type="button"
                                @click="open = false"
                                class="rounded-md p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700"
                                aria-label="閉じる">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M18 6 6 18"/>
                                <path d="m6 6 12 12"/>
                            </svg>
                        </button>
                    </div>
                    <div id="index-filter-setting-modal-body" class="min-h-[12rem]">
                        <div class="rounded-lg border border-dashed border-slate-300 px-4 py-8 text-center text-sm text-slate-500 dark:border-slate-600 dark:text-slate-400">
                            読み込み中...
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <div class="flex items-center gap-2">
        <i data-lucide="search" class="h-4 w-4 text-slate-500 dark:text-slate-400" aria-hidden="true"></i>
        <input type="search"
               name="q"
               th:value="${keyword}"
               aria-label="検索"
               placeholder="証券コード・会社名で検索"
               class="w-full rounded border border-slate-300 px-3 py-2 sm:w-64 dark:border-slate-600 dark:bg-slate-900"
               th:attr="hx-get=@{/v3/index/table(target=${target},sort=${sortParam},page=0)}"
               hx-target="#index-table"
               hx-trigger="keyup changed delay:300ms, search"
               hx-include="#index-size-select"
               hx-push-url="true">
    </div>

    <div class="flex items-center gap-2 sm:hidden">
        <label for="index-sort-select" class="text-xs text-slate-500 dark:text-slate-400">並び替え</label>
        <select id="index-sort-select"
                name="sort"
                aria-label="並び替え"
                class="flex-1 rounded border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900"
                th:attr="hx-get=@{/v3/index/table(target=${target},q=${keyword},page=0)}"
                hx-target="#index-table"
                hx-trigger="change"
                hx-include="#index-size-select"
                hx-push-url="true">
            <option value="code,asc"                    th:selected="${sortParam == 'code,asc' or #strings.isEmpty(sortParam)}">証券コード ↑</option>
            <option value="code,desc"                   th:selected="${sortParam == 'code,desc'}">証券コード ↓</option>
            <option value="name,asc"                    th:selected="${sortParam == 'name,asc'}">会社名 ↑</option>
            <option value="submitDate,desc"             th:selected="${sortParam == 'submitDate,desc'}">提出日（新しい順）</option>
            <option value="submitDate,asc"              th:selected="${sortParam == 'submitDate,asc'}">提出日（古い順）</option>
            <option value="latestCorporateValue,desc"   th:selected="${sortParam == 'latestCorporateValue,desc'}">最新企業価値 ↓</option>
            <option value="latestCorporateValue,asc"    th:selected="${sortParam == 'latestCorporateValue,asc'}">最新企業価値 ↑</option>
            <option value="discountRate,desc"           th:selected="${sortParam == 'discountRate,desc'}">割安比率 ↓</option>
            <option value="coefficientOfVariation,asc"  th:selected="${sortParam == 'coefficientOfVariation,asc'}">変動係数 ↑</option>
        </select>
    </div>

    <div id="index-table"
         th:insert="~{fragments/index-table :: table (table=${table}, target=${target}, keyword=${keyword}, sortParam=${sortParam})}">
    </div>
</section>
</body>
</html>
