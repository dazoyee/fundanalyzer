<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout-v2}">
<head>
    <title>会社一覧</title>
</head>
<body>
<h1 layout:fragment="page-title">会社一覧</h1>

<section layout:fragment="content" class="space-y-4">
    <nav class="flex flex-wrap gap-1 border-b border-slate-200 dark:border-slate-700" role="tablist">
        <a th:attr="hx-get=@{/v3/index/table(q=${keyword},sort=${sortParam},page=0)}"
           th:href="@{/v3/index(q=${keyword},sort=${sortParam})}"
           hx-target="#index-table"
           hx-push-url="true"
           th:classappend="${target == null} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
           class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="layout-grid" class="h-4 w-4"></i>
            メイン
        </a>
        <a th:attr="hx-get=@{/v3/index/table(target='quart',q=${keyword},sort=${sortParam},page=0)}"
           th:href="@{/v3/index(target='quart',q=${keyword},sort=${sortParam})}"
           hx-target="#index-table"
           hx-push-url="true"
           th:classappend="${target == 'quart'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
           class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="calendar-days" class="h-4 w-4"></i>
            四半期
        </a>
        <a th:attr="hx-get=@{/v3/index/table(target='all',q=${keyword},sort=${sortParam},page=0)}"
           th:href="@{/v3/index(target='all',q=${keyword},sort=${sortParam})}"
           hx-target="#index-table"
           hx-push-url="true"
           th:classappend="${target == 'all'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
           class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="layers" class="h-4 w-4"></i>
            すべて
        </a>
        <a th:attr="hx-get=@{/v3/index/table(target='favorite',q=${keyword},sort=${sortParam},page=0)}"
           th:href="@{/v3/index(target='favorite',q=${keyword},sort=${sortParam})}"
           hx-target="#index-table"
           hx-push-url="true"
           th:classappend="${target == 'favorite'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
           class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="heart" class="h-4 w-4"></i>
            お気に入り
        </a>
    </nav>

    <div class="flex items-center gap-2">
        <i data-lucide="search" class="h-4 w-4 text-slate-500 dark:text-slate-400"></i>
        <input type="search"
               name="q"
               th:value="${keyword}"
               placeholder="証券コード・会社名で検索"
               class="w-full rounded border border-slate-300 px-3 py-2 sm:w-64 dark:border-slate-600 dark:bg-slate-900"
               th:attr="hx-get=@{/v3/index/table(target=${target},sort=${sortParam},page=0)}"
               hx-target="#index-table"
               hx-trigger="keyup changed delay:300ms, search"
               hx-push-url="true">
    </div>

    <div id="index-table"
         th:replace="~{fragments/index-table :: table (table=${table}, target=${target}, keyword=${keyword}, sortParam=${sortParam})}">
    </div>
</section>
</body>
</html>
