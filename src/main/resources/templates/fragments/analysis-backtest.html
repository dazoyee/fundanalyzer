<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="backtest" class="space-y-4">
    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
            <div>
                <h3 class="text-sm font-bold">バックテスト概要</h3>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">(企業×有報)単位・重複除去なし・市場比較なし・廃止銘柄除外により上振れバイアスがある参考値です。</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <div th:each="h : ${backtest.horizons()}"
                     class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-xs text-slate-600 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-300">
                    <p class="font-semibold text-slate-900 dark:text-slate-100" th:text="${h.horizon().getLabel()}">6ヶ月</p>
                    <p th:text="'母数 ' + ${#numbers.formatInteger(h.episodeCount(), 1, 'COMMA')} + '件'">母数 0件</p>
                    <p th:text="'廃止除外 ' + ${#numbers.formatInteger(h.excludedDelisted(), 1, 'COMMA')} + '件 / 欠損除外 ' + ${#numbers.formatInteger(h.excludedMissing(), 1, 'COMMA')} + '件'">廃止除外 0件 / 欠損除外 0件</p>
                </div>
            </div>
        </div>
        <div class="mt-4 flex flex-wrap gap-2">
            <button th:each="h : ${horizons}"
                    type="button"
                    th:attr="hx-get=@{/v3/analysis/backtest(horizon=${h.getLabel()})}"
                    hx-target="#backtest-panel"
                    hx-swap="innerHTML"
                    th:classappend="${h == selectedHorizon} ? ' border-blue-600 bg-blue-50 text-blue-600 dark:border-blue-400 dark:bg-blue-500/10 dark:text-blue-400' : ' border-slate-200 text-slate-600 hover:border-slate-300 hover:text-slate-900 dark:border-slate-700 dark:text-slate-400 dark:hover:border-slate-600 dark:hover:text-slate-100'"
                    class="inline-flex items-center rounded-full border px-4 py-2 text-sm font-medium transition">
                <span th:text="${h.getLabel()}">6ヶ月</span>
            </button>
        </div>
    </section>

    <section th:if="${selectedResult == null}"
             class="rounded-xl border border-dashed border-slate-300 bg-white/70 p-8 text-center text-sm text-slate-500 shadow-sm dark:border-slate-700 dark:bg-slate-800/70 dark:text-slate-400">
        対象データがありません。
    </section>

    <div th:if="${selectedResult != null}" class="grid gap-4 xl:grid-cols-[minmax(0,1.35fr)_minmax(0,1fr)]">
        <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <div class="mb-3 flex items-start justify-between gap-3">
                <div>
                    <h3 class="text-sm font-bold">バケット別リターン</h3>
                    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">選択期間の割安度帯ごとのリターン傾向です。</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-slate-500 dark:text-slate-400">相関係数</p>
                    <p class="text-sm font-semibold text-slate-900 dark:text-slate-100"
                       th:text="${selectedResult.correlation() != null ? #numbers.formatDecimal(selectedResult.correlation(), 1, 2) : '-'}">-</p>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm">
                    <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500 dark:bg-slate-900/60 dark:text-slate-400">
                    <tr>
                        <th class="px-4 py-3 font-medium">ラベル</th>
                        <th class="px-4 py-3 font-medium">独立件数</th>
                        <th class="px-4 py-3 font-medium">平均リターン</th>
                        <th class="px-4 py-3 font-medium">中央値</th>
                        <th class="px-4 py-3 font-medium">的中率</th>
                        <th class="px-4 py-3 font-medium">収束度</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                    <tr th:each="bucket : ${selectedResult.buckets()}">
                        <td class="whitespace-nowrap px-4 py-3 font-medium text-slate-900 dark:text-slate-100" th:text="${bucket.label()}">0-10%</td>
                        <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300" th:text="${#numbers.formatInteger(bucket.count(), 1, 'COMMA')}">0</td>
                        <td class="whitespace-nowrap px-4 py-3"
                            th:classappend="${bucket.avgReturn() == null ? ' text-slate-600 dark:text-slate-300' : (bucket.avgReturn() > 0 ? ' text-emerald-600 dark:text-emerald-400' : (bucket.avgReturn() < 0 ? ' text-rose-600 dark:text-rose-400' : ' text-slate-600 dark:text-slate-300'))}"
                            th:text="${bucket.avgReturn() != null ? #numbers.formatDecimal(bucket.avgReturn() * 100, 1, 2) + '%' : '-'}">-</td>
                        <td class="whitespace-nowrap px-4 py-3"
                            th:classappend="${bucket.medianReturn() == null ? ' text-slate-600 dark:text-slate-300' : (bucket.medianReturn() > 0 ? ' text-emerald-600 dark:text-emerald-400' : (bucket.medianReturn() < 0 ? ' text-rose-600 dark:text-rose-400' : ' text-slate-600 dark:text-slate-300'))}"
                            th:text="${bucket.medianReturn() != null ? #numbers.formatDecimal(bucket.medianReturn() * 100, 1, 2) + '%' : '-'}">-</td>
                        <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                            th:text="${bucket.hitRate() != null ? #numbers.formatDecimal(bucket.hitRate() * 100, 1, 2) + '%' : '-'}">-</td>
                        <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                            th:text="${bucket.avgConvergence() != null ? #numbers.formatDecimal(bucket.avgConvergence() * 100, 1, 2) + '%' : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <div class="mb-3 flex items-start justify-between gap-3">
                <div>
                    <h3 class="text-sm font-bold">割安度とリターンの散布図</h3>
                    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">割安度と将来リターンの関係を点群で表示します。</p>
                </div>
            </div>
            <div class="relative h-64">
                <canvas data-backtest-scatter
                        th:attr="data-points=${scatterJson}">
                </canvas>
            </div>
        </section>
    </div>

    <section th:if="${selectedResult != null}"
             class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <div class="mb-3">
            <h3 class="text-sm font-bold">業種内訳</h3>
            <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">業種別の平均割安度とリターンを表示します。</p>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full text-left text-sm">
                <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500 dark:bg-slate-900/60 dark:text-slate-400">
                <tr>
                    <th class="px-4 py-3 font-medium">業種名</th>
                    <th class="px-4 py-3 font-medium">平均割安度</th>
                    <th class="px-4 py-3 font-medium">平均リターン</th>
                    <th class="px-4 py-3 font-medium">的中率</th>
                    <th class="px-4 py-3 font-medium">件数</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                <tr th:each="industry : ${selectedResult.industries()}">
                    <td class="px-4 py-3 font-medium text-slate-900 dark:text-slate-100" th:text="${industry.industryName()}">業種</td>
                    <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                        th:text="${industry.avgDiscountRate() != null ? #numbers.formatDecimal(industry.avgDiscountRate() * 100, 1, 2) + '%' : '-'}">-</td>
                    <td class="whitespace-nowrap px-4 py-3"
                        th:classappend="${industry.avgReturn() == null ? ' text-slate-600 dark:text-slate-300' : (industry.avgReturn() > 0 ? ' text-emerald-600 dark:text-emerald-400' : (industry.avgReturn() < 0 ? ' text-rose-600 dark:text-rose-400' : ' text-slate-600 dark:text-slate-300'))}"
                        th:text="${industry.avgReturn() != null ? #numbers.formatDecimal(industry.avgReturn() * 100, 1, 2) + '%' : '-'}">-</td>
                    <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                        th:text="${industry.hitRate() != null ? #numbers.formatDecimal(industry.hitRate() * 100, 1, 2) + '%' : '-'}">-</td>
                    <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                        th:text="${#numbers.formatInteger(industry.count(), 1, 'COMMA')}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

</body>
</html>
