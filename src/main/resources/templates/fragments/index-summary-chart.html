<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  会社一覧アコーディオン用 summaryChart フラグメント。
  IndexPresenter#summaryCorporateChart が返す。htmx の outerHTML swap でスピナーと差し替わる。
-->
<div th:fragment="chart" class="mt-3">
    <div class="relative h-40 sm:h-48">
        <canvas th:id="${chartId}"></canvas>
    </div>
    <script th:inline="javascript">
        (function () {
            const el = document.getElementById([[${chartId}]]);
            if (!el) return;
            const labels = /*[[${analysisLabelAll}]]*/ [];
            const cvPoints = /*[[${analysisPointAll}]]*/ [];
            const stPoints = /*[[${stockPointBySubmit}]]*/ [];
            if (!labels || !labels.length) return;
            new Chart(el.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '企業価値',
                            data: cvPoints,
                            borderColor: 'rgb(59,130,246)',
                            backgroundColor: 'rgba(59,130,246,0.1)',
                            spanGaps: true,
                            tension: 0.1,
                            pointRadius: 3,
                            borderWidth: 2
                        },
                        {
                            label: '株価',
                            data: stPoints,
                            borderColor: 'rgb(16,185,129)',
                            backgroundColor: 'transparent',
                            spanGaps: true,
                            tension: 0.1,
                            pointRadius: 3,
                            borderWidth: 1.5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {boxWidth: 12, font: {size: 11}}
                        }
                    },
                    scales: {
                        x: {ticks: {maxTicksLimit: 6, font: {size: 10}}}
                    }
                }
            });
        })();
    </script>
</div>

</body>
</html>
