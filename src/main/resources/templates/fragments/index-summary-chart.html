<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  会社一覧アコーディオン用 summaryChart フラグメント。
  IndexPresenter#summaryCorporateChart が返す。htmx の outerHTML swap でスピナーと差し替わる。
-->
<div th:fragment="chart" class="mt-3">
    <div class="relative h-40 sm:h-48">
        <canvas th:id="${chartId}"
                data-summary-chart
                th:attr="data-labels=${labelsJson},data-cv=${cvJson},data-st=${stJson}">
        </canvas>
    </div>
</div>

</body>
</html>
