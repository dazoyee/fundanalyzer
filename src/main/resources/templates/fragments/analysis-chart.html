<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="chart" class="grid gap-4 lg:grid-cols-2">
    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <div class="mb-3 flex items-start justify-between gap-3">
            <div>
                <h3 class="text-sm font-bold">企業価値と株価</h3>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">期ごとの企業価値と提出日時点までの株価を比較します。</p>
            </div>
            <div class="flex flex-wrap items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
                <span class="inline-flex items-center gap-1">
                    <span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
                    企業価値
                </span>
                <span class="inline-flex items-center gap-1">
                    <span class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
                    株価
                </span>
            </div>
        </div>
        <div class="relative h-48">
            <canvas th:id="${chartId}"
                    data-analysis-summary
                    th:attr="data-labels=${labelsJson},data-cv=${cvJson},data-st=${stJson}">
            </canvas>
        </div>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <div class="mb-3 flex items-start justify-between gap-3">
            <div>
                <h3 class="text-sm font-bold">評価トレンド</h3>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">割安度・グレアム指数・提出日比率の推移です。</p>
            </div>
            <div class="flex flex-wrap items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
                <span class="inline-flex items-center gap-1">
                    <span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
                    割安度%
                </span>
                <span class="inline-flex items-center gap-1">
                    <span class="h-2.5 w-2.5 rounded-full bg-violet-600"></span>
                    グレアム指数
                </span>
                <span class="inline-flex items-center gap-1">
                    <span class="h-2.5 w-2.5 rounded-full bg-amber-600"></span>
                    提出日比率
                </span>
            </div>
        </div>
        <div class="relative h-48">
            <canvas data-analysis-trend
                    th:attr="data-labels=${trendLabelsJson},data-disc=${discJson},data-graham=${grahamJson},data-ratio=${ratioJson}">
            </canvas>
        </div>
    </section>
</div>

</body>
</html>
