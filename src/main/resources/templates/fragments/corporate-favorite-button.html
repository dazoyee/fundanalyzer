<button th:fragment="favorite-button (code, favorite)"
        type="button"
        th:attr="hx-post=@{/v3/corporate/favorite(code=${code})}"
        hx-target="this"
        hx-swap="outerHTML"
        th:title="${favorite} ? 'お気に入りから外す' : 'お気に入りに登録'"
        th:aria-label="${favorite} ? 'お気に入りから外す' : 'お気に入りに登録'"
        class="inline-flex h-8 w-8 items-center justify-center rounded text-slate-400 hover:bg-slate-100 hover:text-red-500 dark:hover:bg-slate-700 dark:hover:text-red-400">
    <i data-lucide="heart"
       th:class="${favorite} ? 'h-4 w-4 fill-current text-red-500' : 'h-4 w-4'"
       aria-hidden="true"></i>
</button>
