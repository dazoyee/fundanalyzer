<button th:fragment="star-button (code, star)"
        type="button"
        th:attr="hx-post=@{/v3/corporate/star(code=${code})}"
        hx-target="this"
        hx-swap="outerHTML"
        th:title="${star} ? '注目から外す' : '注目に登録'"
        th:aria-label="${star} ? '注目から外す' : '注目に登録'"
        class="inline-flex h-8 w-8 items-center justify-center rounded text-slate-400 hover:bg-slate-100 hover:text-amber-500 dark:hover:bg-slate-700 dark:hover:text-amber-400">
    <i data-lucide="star"
       th:class="${star} ? 'h-4 w-4 fill-current text-amber-500' : 'h-4 w-4'"
       aria-hidden="true"></i>
</button>
