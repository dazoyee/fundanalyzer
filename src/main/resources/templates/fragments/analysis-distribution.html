<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="distribution" class="space-y-4">
    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
            <div>
                <h3 class="text-sm font-bold">分布サマリ</h3>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">全銘柄の割安度とグレアム指数の代表値です。</p>
            </div>
            <div class="grid gap-2 sm:grid-cols-3">
                <div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-xs text-slate-600 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-300">
                    <p class="text-slate-500 dark:text-slate-400">割安度 中央値</p>
                    <p class="mt-1 text-sm font-semibold text-slate-900 dark:text-slate-100"
                       th:text="${distribution.discountMedian() != null ? #numbers.formatDecimal(distribution.discountMedian(), 1, 1) + '%' : '-'}">-</p>
                </div>
                <div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-xs text-slate-600 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-300">
                    <p class="text-slate-500 dark:text-slate-400">割安度 平均</p>
                    <p class="mt-1 text-sm font-semibold text-slate-900 dark:text-slate-100"
                       th:text="${distribution.discountMean() != null ? #numbers.formatDecimal(distribution.discountMean(), 1, 1) + '%' : '-'}">-</p>
                </div>
                <div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-xs text-slate-600 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-300">
                    <p class="text-slate-500 dark:text-slate-400">グレアム中央値</p>
                    <p class="mt-1 text-sm font-semibold text-slate-900 dark:text-slate-100"
                       th:text="${distribution.grahamMedian() != null ? #numbers.formatDecimal(distribution.grahamMedian(), 1, 1) : '-'}">-</p>
                </div>
            </div>
        </div>
    </section>

    <div class="grid gap-4 xl:grid-cols-2">
        <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <div class="mb-3">
                <h3 class="text-sm font-bold">割安度の分布</h3>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">割安度帯ごとの件数を表示します。</p>
            </div>
            <div class="relative h-64">
                <canvas data-distribution-discount
                        th:attr="data-labels=${discountLabelsJson},data-counts=${discountCountsJson}">
                </canvas>
            </div>
        </section>

        <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <div class="mb-3">
                <h3 class="text-sm font-bold">グレアム指数の分布</h3>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">グレアム指数帯ごとの件数を表示します。</p>
            </div>
            <div class="relative h-64">
                <canvas data-distribution-graham
                        th:attr="data-labels=${grahamLabelsJson},data-counts=${grahamCountsJson}">
                </canvas>
            </div>
        </section>
    </div>

    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <div class="mb-3">
            <h3 class="text-sm font-bold">業種別割安度ランキング</h3>
            <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">業種別の代表値と件数を表示します。</p>
        </div>

        <div th:if="${distribution.industries() != null and !distribution.industries().isEmpty()}" class="overflow-x-auto">
            <table class="min-w-full text-left text-sm">
                <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500 dark:bg-slate-900/60 dark:text-slate-400">
                <tr>
                    <th class="whitespace-nowrap px-4 py-3 font-medium">業種名</th>
                    <th class="whitespace-nowrap px-4 py-3 font-medium">割安度中央値(%)</th>
                    <th class="whitespace-nowrap px-4 py-3 font-medium">割安度平均(%)</th>
                    <th class="whitespace-nowrap px-4 py-3 font-medium">グレアム中央値</th>
                    <th class="whitespace-nowrap px-4 py-3 font-medium">件数</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                <tr th:each="industry : ${distribution.industries()}">
                    <td class="whitespace-nowrap px-4 py-3 font-medium text-slate-900 dark:text-slate-100"
                        th:text="${industry.industryName() != null ? industry.industryName() : '-'}">業種</td>
                    <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                        th:text="${industry.discountMedian() != null ? #numbers.formatDecimal(industry.discountMedian(), 1, 1) + '%' : '-'}">-</td>
                    <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                        th:text="${industry.discountMean() != null ? #numbers.formatDecimal(industry.discountMean(), 1, 1) + '%' : '-'}">-</td>
                    <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                        th:text="${industry.grahamMedian() != null ? #numbers.formatDecimal(industry.grahamMedian(), 1, 1) : '-'}">-</td>
                    <td class="whitespace-nowrap px-4 py-3 text-slate-600 dark:text-slate-300"
                        th:text="${#numbers.formatInteger(industry.count(), 1, 'COMMA')}">0</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${distribution.industries() == null or distribution.industries().isEmpty()}"
             class="rounded-xl border border-dashed border-slate-300 bg-white/70 p-8 text-center text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-800/70 dark:text-slate-400">
            表示できる業種別データがありません。
        </div>
    </section>
</div>

</body>
</html>
