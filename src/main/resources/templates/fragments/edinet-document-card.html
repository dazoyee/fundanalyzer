<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    EDINET 詳細画面の書類カード fragment。
    edinet-list-detail-v2 のネスト深度を抑えるため切り出した。
    引数:
      - submitDate: 提出日 (yyyy-MM-dd 文字列)
      - documentDetail: 書類詳細ビューモデル (document / financeValue / companyName)
-->
<div th:fragment="card (submitDate, documentDetail)"
     x-data="{ open: true }"
     class="rounded border border-slate-200 dark:border-slate-700">
    <button type="button" @click="open = !open" :aria-expanded="open"
            class="flex w-full items-center justify-between gap-2 border-b border-slate-200 bg-slate-50 px-3 py-2 text-left text-sm font-semibold dark:border-slate-700 dark:bg-slate-700">
        <span class="inline-flex items-center gap-2">
            <i data-lucide="chevron-right" class="h-4 w-4" x-show="!open" aria-hidden="true"></i>
            <i data-lucide="chevron-down" class="h-4 w-4" x-show="open" aria-hidden="true"></i>
            <span th:text="${documentDetail.companyName}">会社名</span>
        </span>
    </button>
    <div x-show="open" class="space-y-4 p-3">

        <!-- 10 列メタデータテーブル -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 text-sm dark:divide-slate-700">
                <thead class="bg-slate-50 dark:bg-slate-700">
                <tr>
                    <th class="px-2 py-2 text-left text-xs font-semibold">書類ID</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">EDINETコード</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">書類種別</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">対象年</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">DL</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">DC</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">NS</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">BS</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">PL</th>
                    <th class="px-2 py-2 text-left text-xs font-semibold">RM</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td class="px-2 py-2 font-mono text-xs" th:text="${documentDetail.document.documentId}">-</td>
                    <td class="px-2 py-2 font-mono text-xs" th:text="${documentDetail.document.edinetCode}">-</td>
                    <td class="px-2 py-2 text-xs" th:text="${documentDetail.document.documentTypeName}">-</td>
                    <td class="px-2 py-2 font-mono text-xs" th:text="${documentDetail.document.documentPeriod}">-</td>
                    <td class="px-2 py-2 font-mono text-xs" th:text="${documentDetail.document.downloaded}">-</td>
                    <td class="px-2 py-2 font-mono text-xs" th:text="${documentDetail.document.decoded}">-</td>
                    <td class="px-2 py-2 font-mono text-xs" th:text="${documentDetail.document.scrapedNumberOfShares}">-</td>
                    <td class="px-2 py-2 font-mono text-xs" th:text="${documentDetail.document.scrapedBs}">-</td>
                    <td class="px-2 py-2 font-mono text-xs" th:text="${documentDetail.document.scrapedPl}">-</td>
                    <td class="px-2 py-2">
                        <form method="post" th:action="@{/v1/remove/document}">
                            <input type="hidden" th:value="${submitDate}" name="submitDate"/>
                            <input type="hidden" th:value="${documentDetail.document.documentId}" name="documentId"/>
                            <button type="submit"
                                    class="rounded border border-slate-300 px-2 py-1 text-xs hover:bg-slate-50 dark:border-slate-600 dark:hover:bg-slate-700">
                                除外
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 書類別 2 アクションボタン -->
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <form method="post" th:action="@{/v2/scrape/id}">
                <input type="hidden" th:value="${submitDate}" name="date"/>
                <input type="hidden" th:value="${documentDetail.document.documentId}" name="documentId"/>
                <button type="submit"
                        class="w-full rounded border border-blue-400 bg-white px-4 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 dark:border-blue-500 dark:bg-slate-800 dark:text-blue-400 dark:hover:bg-slate-700">
                    スクレイピング/分析する
                </button>
            </form>
            <form method="post" th:action="@{/v1/update/all-done/status}">
                <input type="hidden" th:value="${submitDate}" name="date"/>
                <input type="hidden" th:value="${documentDetail.document.documentId}" name="documentId"/>
                <button type="submit"
                        class="w-full rounded border border-blue-400 bg-white px-4 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 dark:border-blue-500 dark:bg-slate-800 dark:text-blue-400 dark:hover:bg-slate-700">
                    ステータス更新：すべて完了
                </button>
            </form>
        </div>

        <!-- 書類ファイル外部リンク 3 種 + 財務値 10 編集フォーム -->
        <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
            <!-- BS/PL/NS リンク -->
            <div class="rounded border border-blue-200 bg-blue-50 p-3 dark:border-blue-800 dark:bg-blue-950">
                <dl class="grid grid-cols-[3rem_1fr] gap-x-3 gap-y-2 text-sm">
                    <dt class="font-semibold">BS</dt>
                    <dd class="break-all">
                        <a th:unless="${documentDetail.document.bsDocumentPath == null}"
                           th:text="${documentDetail.document.bsDocumentPath}"
                           th:href="${documentDetail.document.bsDocumentPath}"
                           target="_blank" rel="noopener"
                           class="text-blue-600 hover:underline dark:text-blue-400">-</a>
                        <span th:if="${documentDetail.document.bsDocumentPath == null}" class="text-slate-400">未取得</span>
                    </dd>
                    <dt class="font-semibold">PL</dt>
                    <dd class="break-all">
                        <a th:unless="${documentDetail.document.plDocumentPath == null}"
                           th:text="${documentDetail.document.plDocumentPath}"
                           th:href="${documentDetail.document.plDocumentPath}"
                           target="_blank" rel="noopener"
                           class="text-blue-600 hover:underline dark:text-blue-400">-</a>
                        <span th:if="${documentDetail.document.plDocumentPath == null}" class="text-slate-400">未取得</span>
                    </dd>
                    <dt class="font-semibold">NS</dt>
                    <dd class="break-all">
                        <a th:unless="${documentDetail.document.numberOfSharesDocumentPath == null}"
                           th:text="${documentDetail.document.numberOfSharesDocumentPath}"
                           th:href="${documentDetail.document.numberOfSharesDocumentPath}"
                           target="_blank" rel="noopener"
                           class="text-blue-600 hover:underline dark:text-blue-400">-</a>
                        <span th:if="${documentDetail.document.numberOfSharesDocumentPath == null}" class="text-slate-400">未取得</span>
                    </dd>
                </dl>
            </div>

            <!-- 10 財務値 -->
            <div class="rounded border border-blue-200 bg-blue-50 p-3 dark:border-blue-800 dark:bg-blue-950">
                <dl class="grid grid-cols-[10rem_1fr] gap-x-3 gap-y-2 text-sm"
                    th:with="fv=${documentDetail.financeValue}">

                    <th:block th:each="fld : ${ {
                        {fv.totalCurrentAssets, 'totalCurrentAssets'},
                        {fv.totalInvestmentsAndOtherAssets, 'totalInvestmentsAndOtherAssets'},
                        {fv.totalAssets, 'totalAssets'},
                        {fv.totalCurrentLiabilities, 'totalCurrentLiabilities'},
                        {fv.totalFixedLiabilities, 'totalFixedLiabilities'},
                        {fv.subscriptionWarrant, 'subscriptionWarrant'},
                        {fv.netAssets, 'netAssets'},
                        {fv.operatingProfit, 'operatingProfit'},
                        {fv.netIncome, 'netIncome'},
                        {fv.numberOfShares, 'numberOfShares'} } }">
                        <dt class="font-semibold" th:text="${fld[0].name}">項目</dt>
                        <dd>
                            <span th:unless="${fld[0].value == null}"
                                  th:text="${fld[0].value}"
                                  class="font-mono">-</span>
                            <form th:if="${fld[0].value == null}"
                                  method="post" th:action="@{/v1/fix-fundamental-value}"
                                  class="flex flex-wrap items-center gap-1">
                                <input type="hidden" th:value="${submitDate}" name="submitDate"/>
                                <input type="hidden" th:value="${documentDetail.document.edinetCode}" name="edinetCode"/>
                                <input type="hidden" th:value="${documentDetail.document.documentId}" name="documentId"/>
                                <input type="hidden" th:value="${fld[0].financialStatementId}" name="financialStatementId"/>
                                <input type="hidden" th:value="${fld[0].subjectId}" name="subjectId"/>
                                <input type="number" name="value"
                                       th:attr="aria-label=|${fld[0].name} の値|"
                                       class="w-32 rounded border border-slate-300 px-2 py-1 text-xs dark:border-slate-600 dark:bg-slate-900"/>
                                <button type="submit"
                                        class="rounded border border-slate-300 px-2 py-1 text-xs hover:bg-slate-50 dark:border-slate-600 dark:hover:bg-slate-700">
                                    登録
                                </button>
                            </form>
                        </dd>
                    </th:block>
                </dl>
            </div>
        </div>
    </div>
</div>

</body>
</html>
