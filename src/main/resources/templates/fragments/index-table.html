<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="table (table, target, keyword, sortParam)" class="space-y-3">
    <div class="text-sm text-slate-600 dark:text-slate-400" th:if="${table.totalElements() > 0}">
        <span th:text="${table.totalElements()}">0</span> 件中
        <span th:text="${table.pageNumber() * table.pageSize() + 1}">1</span> -
        <span th:text="${table.pageNumber() * table.pageSize() + table.companies().size()}">25</span> 件目
    </div>

    <!-- desktop: 既存テーブル (sm 以上) -->
    <div class="hidden overflow-x-auto rounded-lg border border-slate-200 dark:border-slate-700 sm:block">
        <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
            <thead class="bg-slate-50 dark:bg-slate-800">
            <tr>
                <th th:replace="~{fragments/index-table :: sortable-th (field='code', label='証券コード', target=${target}, keyword=${keyword}, sortParam=${sortParam})}"></th>
                <th th:replace="~{fragments/index-table :: sortable-th (field='name', label='会社名', target=${target}, keyword=${keyword}, sortParam=${sortParam})}"></th>
                <th th:replace="~{fragments/index-table :: sortable-th (field='submitDate', label='提出日', target=${target}, keyword=${keyword}, sortParam=${sortParam})}"></th>
                <th th:replace="~{fragments/index-table :: sortable-th (field='latestCorporateValue', label='最新企業価値', target=${target}, keyword=${keyword}, sortParam=${sortParam})}"></th>
                <th th:replace="~{fragments/index-table :: sortable-th (field='coefficientOfVariation', label='変動係数', target=${target}, keyword=${keyword}, sortParam=${sortParam})}"></th>
                <th th:replace="~{fragments/index-table :: sortable-th (field='averageStockPrice', label='株価平均', target=${target}, keyword=${keyword}, sortParam=${sortParam})}"></th>
                <th th:replace="~{fragments/index-table :: sortable-th (field='discountRate', label='割安比率', target=${target}, keyword=${keyword}, sortParam=${sortParam})}"></th>
                <th th:replace="~{fragments/index-table :: sortable-th (field='countYear', label='対象年数', target=${target}, keyword=${keyword}, sortParam=${sortParam})}"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
            <tr th:each="c : ${table.companies()}"
                class="bg-white hover:bg-slate-50 dark:bg-slate-900 dark:hover:bg-slate-800">
                <td class="px-3 py-2 font-mono text-sm">
                    <a th:href="@{/v3/corporate(code=${c.code},target=${target ?: 'main'})}"
                       th:text="${c.code}"
                       class="text-blue-600 hover:underline dark:text-blue-400">9999</a>
                    <a th:href="'https://minkabu.jp/stock/' + ${c.code}" target="_blank" rel="noopener"
                       class="ml-1 inline-flex items-center text-slate-400 hover:text-blue-600 dark:hover:text-blue-400"
                       title="みんかぶで開く">
                        <i data-lucide="external-link" class="h-3 w-3" aria-hidden="true"></i>
                    </a>
                </td>
                <td class="px-3 py-2 text-sm">
                    <a th:href="@{/v3/corporate(code=${c.code},target=${target ?: 'main'})}"
                       th:text="${c.name}"
                       class="text-blue-600 hover:underline dark:text-blue-400">サンプル会社</a>
                </td>
                <td class="px-3 py-2 text-sm" th:text="${c.submitDate}">2025-01-01</td>
                <td class="px-3 py-2 text-right text-sm font-mono" th:text="${c.latestCorporateValue}">0</td>
                <td class="px-3 py-2 text-right text-sm font-mono" th:text="${c.coefficientOfVariationToDisplay}">-</td>
                <td class="px-3 py-2 text-right text-sm font-mono" th:text="${c.averageStockPrice}">-</td>
                <td class="px-3 py-2 text-right text-sm font-mono" th:text="${c.discountRateToDisplay}">-</td>
                <td class="px-3 py-2 text-right text-sm font-mono" th:text="${c.countYear}">-</td>
            </tr>
            <tr th:if="${table.companies().isEmpty()}">
                <td colspan="8" class="px-3 py-6 text-center text-slate-500 dark:text-slate-400">
                    該当する会社がありません
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- mobile: カード表示 (sm 未満) -->
    <ul class="block space-y-3 sm:hidden" aria-label="会社一覧">
        <li th:each="c : ${table.companies()}"
            data-mobile-card
            class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
            <div class="flex items-start justify-between gap-2">
                <a th:href="@{/v3/corporate(code=${c.code},target=${target ?: 'main'})}"
                   class="block min-w-0 flex-1 text-blue-600 hover:underline dark:text-blue-400">
                    <div class="flex items-center gap-2 text-sm">
                        <span class="font-mono font-bold" th:text="${c.code}">9999</span>
                        <span class="text-xs text-slate-500 dark:text-slate-400" th:text="${c.submitDate}">2025-01-01</span>
                    </div>
                    <div class="mt-0.5 truncate text-base font-semibold" th:text="${c.name}">サンプル会社</div>
                </a>
                <a th:href="'https://minkabu.jp/stock/' + ${c.code}" target="_blank" rel="noopener"
                   aria-label="みんかぶで開く"
                   class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded text-slate-400 hover:bg-slate-100 hover:text-blue-600 dark:hover:bg-slate-700 dark:hover:text-blue-400">
                    <i data-lucide="external-link" class="h-4 w-4" aria-hidden="true"></i>
                </a>
            </div>
            <dl class="mt-3 grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs">
                <div class="flex justify-between">
                    <dt class="text-slate-500 dark:text-slate-400">最新企業価値</dt>
                    <dd class="font-mono font-semibold" th:text="${c.latestCorporateValue}">-</dd>
                </div>
                <div class="flex justify-between">
                    <dt class="text-slate-500 dark:text-slate-400">割安比率</dt>
                    <dd class="font-mono font-semibold" th:text="${c.discountRateToDisplay}">-</dd>
                </div>
                <div class="flex justify-between">
                    <dt class="text-slate-500 dark:text-slate-400">株価平均</dt>
                    <dd class="font-mono" th:text="${c.averageStockPrice}">-</dd>
                </div>
                <div class="flex justify-between">
                    <dt class="text-slate-500 dark:text-slate-400">変動係数</dt>
                    <dd class="font-mono" th:text="${c.coefficientOfVariationToDisplay}">-</dd>
                </div>
                <div class="flex justify-between">
                    <dt class="text-slate-500 dark:text-slate-400">対象年数</dt>
                    <dd class="font-mono" th:text="${c.countYear}">-</dd>
                </div>
            </dl>
        </li>
        <li th:if="${table.companies().isEmpty()}"
            class="rounded-lg border border-slate-200 bg-white px-3 py-6 text-center text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400">
            該当する会社がありません
        </li>
    </ul>

    <nav class="flex flex-wrap items-center justify-between gap-2" th:if="${table.totalPages() > 1}">
        <div class="text-sm text-slate-600 dark:text-slate-400">
            <span th:text="${table.pageNumber() + 1}">1</span> /
            <span th:text="${table.totalPages()}">1</span> ページ
        </div>
        <div class="flex gap-1">
            <a th:if="${table.pageNumber() > 0}"
               th:href="@{/v3/index(target=${target},q=${keyword},sort=${sortParam},page=${table.pageNumber() - 1})}"
               th:attr="hx-get=@{/v3/index/table(target=${target},q=${keyword},sort=${sortParam},page=${table.pageNumber() - 1})}"
               hx-target="#index-table"
               hx-push-url="true"
               class="inline-flex min-h-[40px] items-center gap-1 rounded border border-slate-300 px-3 py-1 text-sm hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-700">
                <i data-lucide="chevron-left" class="h-4 w-4" aria-hidden="true"></i>
                前へ
            </a>
            <a th:if="${table.pageNumber() < table.totalPages() - 1}"
               th:href="@{/v3/index(target=${target},q=${keyword},sort=${sortParam},page=${table.pageNumber() + 1})}"
               th:attr="hx-get=@{/v3/index/table(target=${target},q=${keyword},sort=${sortParam},page=${table.pageNumber() + 1})}"
               hx-target="#index-table"
               hx-push-url="true"
               class="inline-flex min-h-[40px] items-center gap-1 rounded border border-slate-300 px-3 py-1 text-sm hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-700">
                次へ
                <i data-lucide="chevron-right" class="h-4 w-4" aria-hidden="true"></i>
            </a>
        </div>
    </nav>
</div>

<th th:fragment="sortable-th (field, label, target, keyword, sortParam)"
    class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300">
    <th:block th:with="parts=${(sortParam != null and !#strings.isEmpty(sortParam)) ? sortParam.split(',') : new String[]{'code','asc'}},
                       currentField=${parts[0]},
                       currentDir=${parts.length > 1 ? parts[1] : 'asc'},
                       nextDir=${currentField == field and currentDir == 'asc'} ? 'desc' : 'asc',
                       nextSort=${field + ',' + nextDir}">
        <a th:href="@{/v3/index(target=${target},q=${keyword},sort=${nextSort},page=0)}"
           th:attr="hx-get=@{/v3/index/table(target=${target},q=${keyword},sort=${nextSort},page=0)}"
           hx-target="#index-table"
           hx-push-url="true"
           class="inline-flex cursor-pointer items-center gap-1 hover:text-slate-900 dark:hover:text-slate-100">
            <span th:text="${label}">列名</span>
            <i th:if="${currentField == field and currentDir == 'asc'}" data-lucide="chevron-up" class="h-3 w-3" aria-hidden="true"></i>
            <i th:if="${currentField == field and currentDir == 'desc'}" data-lucide="chevron-down" class="h-3 w-3" aria-hidden="true"></i>
            <i th:unless="${currentField == field}" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30" aria-hidden="true"></i>
        </a>
    </th:block>
</th>

</body>
</html>
