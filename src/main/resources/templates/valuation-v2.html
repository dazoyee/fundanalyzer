<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout-v2}">
<head>
    <title>株価評価</title>
</head>
<body>
<h1 layout:fragment="page-title">株価評価</h1>

<section layout:fragment="content" class="space-y-4">
    <nav class="flex flex-wrap gap-1 border-b border-slate-200 dark:border-slate-700" role="tablist">
        <a th:attr="hx-get=@{/v3/valuation/table(view=${view},q=${keyword},sort=${sortParam},page=0)}"
           th:href="@{/v3/valuation(view=${view},q=${keyword},sort=${sortParam})}"
           hx-target="#valuation-table"
           hx-push-url="true"
           th:classappend="${target == null} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
           class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="layout-grid" class="h-4 w-4"></i>
            メイン
        </a>
        <a th:attr="hx-get=@{/v3/valuation/table(target='all',view=${view},q=${keyword},sort=${sortParam},page=0)}"
           th:href="@{/v3/valuation(target='all',view=${view},q=${keyword},sort=${sortParam})}"
           hx-target="#valuation-table"
           hx-push-url="true"
           th:classappend="${target == 'all'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
           class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="layers" class="h-4 w-4"></i>
            すべて
        </a>
        <a th:attr="hx-get=@{/v3/valuation/table(target='favorite',view=${view},q=${keyword},sort=${sortParam},page=0)}"
           th:href="@{/v3/valuation(target='favorite',view=${view},q=${keyword},sort=${sortParam})}"
           hx-target="#valuation-table"
           hx-push-url="true"
           th:classappend="${target == 'favorite'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
           class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="heart" class="h-4 w-4"></i>
            お気に入り
        </a>
        <a th:attr="hx-get=@{/v3/valuation/table(target='industry',q=${keyword})}"
           th:href="@{/v3/valuation(target='industry')}"
           hx-target="#valuation-table"
           hx-push-url="true"
           th:classappend="${target == 'industry'} ? 'border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'"
           class="inline-flex items-center gap-1 border-b-2 px-4 py-2 text-sm font-medium">
            <i data-lucide="building" class="h-4 w-4"></i>
            業種別
        </a>
    </nav>

    <nav class="flex flex-wrap gap-1" role="tablist" th:unless="${target == 'industry'}">
        <a th:attr="hx-get=@{/v3/valuation/table(target=${target},view='stock',q=${keyword},page=0)}"
           th:href="@{/v3/valuation(target=${target},view='stock',q=${keyword})}"
           hx-target="#valuation-table"
           hx-push-url="true"
           th:classappend="${view == 'stock'} ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600'"
           class="rounded-md px-3 py-1 text-xs font-medium">株価</a>
        <a th:attr="hx-get=@{/v3/valuation/table(target=${target},view='submit',q=${keyword},page=0)}"
           th:href="@{/v3/valuation(target=${target},view='submit',q=${keyword})}"
           hx-target="#valuation-table"
           hx-push-url="true"
           th:classappend="${view == 'submit'} ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600'"
           class="rounded-md px-3 py-1 text-xs font-medium">提出日</a>
        <a th:attr="hx-get=@{/v3/valuation/table(target=${target},view='graham-index',q=${keyword},page=0)}"
           th:href="@{/v3/valuation(target=${target},view='graham-index',q=${keyword})}"
           hx-target="#valuation-table"
           hx-push-url="true"
           th:classappend="${view == 'graham-index'} ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600'"
           class="rounded-md px-3 py-1 text-xs font-medium">グレアム</a>
        <a th:attr="hx-get=@{/v3/valuation/table(target=${target},view='dividend-yield',q=${keyword},page=0)}"
           th:href="@{/v3/valuation(target=${target},view='dividend-yield',q=${keyword})}"
           hx-target="#valuation-table"
           hx-push-url="true"
           th:classappend="${view == 'dividend-yield'} ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600'"
           class="rounded-md px-3 py-1 text-xs font-medium">配当</a>
    </nav>

    <div class="flex items-center gap-2">
        <i data-lucide="search" class="h-4 w-4 text-slate-500 dark:text-slate-400"></i>
        <input type="search"
               name="q"
               th:value="${keyword}"
               th:placeholder="${target == 'industry'} ? '業種名で検索' : '証券コード・会社名で検索'"
               class="w-full rounded border border-slate-300 px-3 py-2 sm:w-64 dark:border-slate-600 dark:bg-slate-900"
               th:attr="hx-get=@{/v3/valuation/table(target=${target},view=${view},sort=${sortParam},page=0)}"
               hx-target="#valuation-table"
               hx-trigger="keyup changed delay:300ms, search"
               hx-push-url="true">
    </div>

    <div id="valuation-table"
         th:replace="~{fragments/valuation-table :: __${view}__-table (table=${table}, target=${target}, view=${view}, keyword=${keyword}, sortParam=${sortParam})}">
    </div>
</section>
</body>
</html>
