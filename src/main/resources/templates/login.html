<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      class="h-full"
      x-data="{
        dark: (() => {
          const stored = localStorage.getItem('fundanalyzer.dark-mode');
          if (stored !== null) return stored === 'true';
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        })()
      }"
      :class="{ 'dark': dark }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - fundanalyzer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="flex min-h-full items-center justify-center bg-slate-50 px-4 py-12 dark:bg-slate-900">

    <div class="w-full max-w-sm">
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">fundanalyzer</h1>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white px-6 py-8 shadow-md dark:border-slate-700 dark:bg-slate-800">
            <h2 class="mb-6 text-lg font-semibold text-slate-900 dark:text-slate-100">ログイン</h2>

            <div th:if="${param.error}"
                 role="alert"
                 class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-800 dark:bg-red-900/20 dark:text-red-400">
                ユーザー名またはパスワードが正しくありません。
            </div>

            <div th:if="${param.logout}"
                 role="status"
                 class="mb-4 rounded-md border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700 dark:border-green-800 dark:bg-green-900/20 dark:text-green-400">
                ログアウトしました。
            </div>

            <form th:action="@{/login}" method="post" class="space-y-5">
                <div>
                    <label for="username"
                           class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">
                        ユーザー名
                    </label>
                    <input id="username"
                           name="username"
                           type="text"
                           autocomplete="username"
                           autocorrect="off"
                           autocapitalize="none"
                           required
                           class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-base text-slate-900 placeholder-slate-400 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 dark:placeholder-slate-500">
                </div>

                <div>
                    <label for="password"
                           class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">
                        パスワード
                    </label>
                    <input id="password"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           required
                           class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-base text-slate-900 placeholder-slate-400 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 dark:placeholder-slate-500">
                </div>

                <button type="submit"
                        class="min-h-[48px] w-full rounded-lg bg-blue-600 px-4 py-3 text-base font-semibold text-white transition-colors hover:bg-blue-700 active:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800">
                    ログイン
                </button>
            </form>
            <p class="mt-4 text-center text-xs text-slate-400 dark:text-slate-500"
               th:text="'v' + ${applicationVersion}">v0.0.0</p>
        </div>
    </div>

    <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
