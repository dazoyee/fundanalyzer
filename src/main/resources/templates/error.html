<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout-v2}">
<head>
    <title>エラー</title>
</head>
<body>
<h1 layout:fragment="page-title">
    <span class="inline-flex items-center gap-2">
        <i data-lucide="alert-triangle" class="text-rose-500 dark:text-rose-400"></i>
        エラー
    </span>
</h1>

<section layout:fragment="content" class="space-y-6">
    <article class="rounded-lg border border-rose-200 bg-rose-50 p-6 dark:border-rose-900/50 dark:bg-rose-950/30">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-4">
            <span class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-rose-100 text-rose-600 dark:bg-rose-900/50 dark:text-rose-300">
                <i data-lucide="x-circle" class="h-6 w-6"></i>
            </span>
            <div>
                <p class="text-sm text-slate-500 dark:text-slate-400">ステータスコード</p>
                <p class="text-2xl font-bold" th:text="${status} ?: '-'">500</p>
            </div>
            <div class="flex-1">
                <p class="text-sm text-slate-500 dark:text-slate-400">エラー</p>
                <p class="text-base font-medium" th:text="${error} ?: 'Unknown Error'">Internal Server Error</p>
            </div>
        </div>
    </article>

    <article class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800"
             th:if="${message != null and !message.isEmpty()}">
        <h2 class="mb-2 text-base font-bold">メッセージ</h2>
        <p class="text-sm text-slate-700 dark:text-slate-300" th:text="${message}">エラーメッセージ</p>
    </article>

    <article class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800"
             th:if="${path != null}">
        <h2 class="mb-2 text-base font-bold">アクセスパス</h2>
        <p class="font-mono text-sm text-slate-700 dark:text-slate-300" th:text="${path}">/some/path</p>
    </article>

    <article class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800"
             th:if="${trace != null}">
        <h2 class="mb-2 text-base font-bold">スタックトレース</h2>
        <pre class="max-h-96 overflow-auto whitespace-pre-wrap break-words rounded bg-slate-100 p-3 text-xs text-slate-800 dark:bg-slate-900 dark:text-slate-300"
             th:text="${trace}">trace</pre>
    </article>

    <div class="flex flex-wrap gap-2">
        <a th:href="@{/v3/index}"
           class="inline-flex items-center gap-1 rounded bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
            <i data-lucide="home" class="h-4 w-4"></i>
            会社一覧へ
        </a>
        <a href="javascript:history.back()"
           class="inline-flex items-center gap-1 rounded border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-700">
            <i data-lucide="arrow-left" class="h-4 w-4"></i>
            戻る
        </a>
    </div>
</section>
</body>
</html>
