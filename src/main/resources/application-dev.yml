server:
  port: 8889
  servlet:
    session:
      cookie:
        secure: false   # dev は HTTP（localhost）のため false。共通の http-only/same-site は application.yml で設定

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:fundanalyzer;DB_CLOSE_ON_EXIT=TRUE;MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password:
  sql.init.mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    encoding: UTF-8
    # dev ではテンプレートのホットリロードを優先しキャッシュ無効化（Spring Boot デフォルトは true）
    cache: false

  flyway:
    locations: classpath:/db/migration, classpath:/db/dataset

  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=0s,recordStats

doma:
  dialect: h2
  naming: snake_upper_case

logging:
  level:
    github.com.ioridazo.fundanalyzer: debug
  config: classpath:log4j2-spring-dev.xml

management:
  server:
    port: 8989
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      application: ${spring.application.name}-dev

app:
  config:
    slack:
      parameter:
        t: ${SLACK_WEBHOOK_T:}
        b: ${SLACK_WEBHOOK_B:}
        x: ${SLACK_WEBHOOK_X:}

  # dev プロファイル限定で OS 非依存パスへ上書き。
  # application.yml は Windows サービス向けデフォルト (C:/fundanalyzer/...) を維持し、
  # release/config/application-prod.yml で prod 用に再定義する。
  settings:
    file:
      path:
        company:
          company: ${user.home}/.${spring.application.name}/company
          zip: ${user.home}/.${spring.application.name}/company/zip
        edinet: ${user.home}/.${spring.application.name}/edinet
        decode: ${user.home}/.${spring.application.name}/decode
